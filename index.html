<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PublikChat 💬</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  html, body {
    height:100dvh; overflow:hidden; background:#0a0a12; color:#fff;
    -webkit-tap-highlight-color:transparent;
  }

  /* ===== AUTH ===== */
  .auth-wrap {
    height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:20px;
    background: radial-gradient(circle at 30% 20%, #2a1050, #0a0a12 60%),
                radial-gradient(circle at 80% 80%, #103050, #0a0a12 60%);
  }
  .auth-box {
    width:100%; max-width:380px; padding:35px; border-radius:20px;
    background:rgba(255,255,255,0.05); backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15);
    box-shadow:0 20px 60px rgba(0,0,0,0.6); animation:fadeIn .5s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(20px);} to{opacity:1;transform:translateY(0);} }
  .auth-box h1 {
    text-align:center; margin-bottom:8px; font-size:28px;
    background:linear-gradient(90deg,#a855f7,#06b6d4);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .auth-box p.sub { text-align:center; color:#888; font-size:13px; margin-bottom:25px; }
  .auth-box input {
    width:100%; padding:13px 15px; margin-bottom:12px; border-radius:12px;
    border:1px solid rgba(255,255,255,0.15); background:rgba(0,0,0,0.4);
    color:#fff; font-size:16px; outline:none; transition:.2s;
  }
  .auth-box input:focus { border-color:#a855f7; box-shadow:0 0 0 3px rgba(168,85,247,0.2); }
  .auth-box button {
    width:100%; padding:13px; border:none; border-radius:12px;
    background:linear-gradient(90deg,#a855f7,#06b6d4);
    color:#fff; font-weight:600; font-size:15px; cursor:pointer;
    transition:.2s; margin-top:5px;
  }
  .auth-box button:hover { transform:translateY(-2px); box-shadow:0 10px 25px rgba(168,85,247,0.4); }
  .switch-text { text-align:center; margin-top:18px; font-size:13px; color:#999; }
  .switch-text a { color:#a855f7; cursor:pointer; text-decoration:none; font-weight:600; }
  .switch-text a:hover { text-decoration:underline; }
  .hidden { display:none !important; }
  .err { color:#ff5566; font-size:12px; text-align:center; margin-bottom:8px; min-height:14px; }
  .loading { text-align:center; color:#a855f7; font-size:13px; margin-bottom:8px; }

  /* ===== CHAT APP ===== */
  .app { height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
  .topbar {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:rgba(15,15,25,0.95);
    border-bottom:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(10px); z-index:5; flex-wrap:wrap; gap:6px;
    flex-shrink:0;
  }
  .topbar .brand { font-weight:700; font-size:17px;
    background:linear-gradient(90deg,#a855f7,#06b6d4);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .topbar .room-badge {
    font-size:10px; padding:3px 8px; border-radius:20px;
    background:rgba(34,197,94,0.2); border:1px solid rgba(34,197,94,0.4);
    color:#86efac; margin-left:6px;
  }
  .topbar .user-info { display:flex; align-items:center; gap:6px; font-size:13px; }
  .topbar .avatar {
    width:30px; height:30px; border-radius:50%;
    background:linear-gradient(135deg,#a855f7,#06b6d4);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px;
  }
  .topbar button {
    padding:7px 10px; border-radius:9px; border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05); color:#fff; cursor:pointer; font-size:12px; transition:.2s;
  }
  .topbar button:hover { background:rgba(255,80,80,0.2); border-color:#ff5566; }

  .chat-area {
    flex:1; overflow-y:auto; padding:16px;
    background-size:cover; background-position:center;
    background-attachment:local; position:relative;
    -webkit-overflow-scrolling:touch; min-height:0;
  }
  .chat-area::before {
    content:''; position:absolute; inset:0;
    background:rgba(0,0,0,0.55); z-index:0; pointer-events:none;
  }
  .chat-area > * { position:relative; z-index:1; }

  .empty-state {
    text-align:center; color:#888; margin-top:60px; font-size:14px; line-height:1.8;
  }
  .empty-state .big { font-size:48px; display:block; margin-bottom:10px; }

  .msg { display:flex; gap:10px; margin-bottom:14px; animation:pop .25s ease; }
  @keyframes pop { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  .msg.self { flex-direction:row-reverse; }
  .msg .av {
    width:36px; height:36px; border-radius:50%; flex-shrink:0;
    background:linear-gradient(135deg,#a855f7,#06b6d4);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:13px;
  }
  .msg.self .av { background:linear-gradient(135deg,#06b6d4,#22c55e); }
  .bubble-wrap { max-width:75%; }
  .msg .name { font-size:11px; color:#aaa; margin-bottom:4px; }
  .msg.self .name { text-align:right; color:#86efac; }
  .bubble {
    padding:10px 14px; border-radius:14px; font-size:14px; line-height:1.5;
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.08);
    word-wrap:break-word; word-break:break-word;
  }
  .msg.self .bubble { background:linear-gradient(135deg,#a855f7,#06b6d4); border:none; }
  .bubble img, .bubble video { max-width:100%; border-radius:10px; display:block; margin-top:6px; }
  .bubble audio { margin-top:6px; width:100%; max-width:230px; }
  .time { font-size:10px; color:#888; margin-top:4px; }
  .msg.self .time { text-align:right; }

  .input-bar {
    display:flex; align-items:center; gap:6px; padding:10px 12px;
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    background:rgba(15,15,25,0.98); border-top:1px solid rgba(255,255,255,0.08);
    flex-shrink:0;
  }
  .input-bar input[type=text] {
    flex:1; padding:12px 16px; border-radius:25px; border:1px solid rgba(255,255,255,0.12);
    background:rgba(0,0,0,0.5); color:#fff; outline:none; font-size:16px;
    min-width:0;
  }
  .input-bar input[type=text]:focus { border-color:#a855f7; }
  .icon-btn {
    width:42px; height:42px; border-radius:50%; border:none; cursor:pointer;
    background:rgba(255,255,255,0.08); color:#fff; font-size:18px;
    display:flex; align-items:center; justify-content:center; transition:.2s; flex-shrink:0;
  }
  .icon-btn:hover { background:rgba(168,85,247,0.4); transform:scale(1.08); }
  .icon-btn.rec { background:#ff2244; animation:pulse 1s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,34,68,0.7);} 50%{box-shadow:0 0 0 12px rgba(255,34,68,0);} }
  .send-btn {
    width:42px; height:42px; border-radius:50%; border:none; cursor:pointer;
    background:linear-gradient(135deg,#a855f7,#06b6d4); color:#fff;
    font-size:18px; display:flex; align-items:center; justify-content:center;
    transition:.2s; flex-shrink:0;
  }
  .send-btn:hover { transform:scale(1.08) rotate(15deg); }

  .wallpaper-panel {
    position:absolute; top:60px; right:12px; z-index:10;
    background:rgba(20,20,35,0.98); backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,0.15); border-radius:14px;
    padding:14px; width:220px; box-shadow:0 15px 40px rgba(0,0,0,0.6);
    animation:fadeIn .25s ease;
  }
  .wallpaper-panel h4 { font-size:13px; margin-bottom:10px; color:#ccc; }
  .wallpaper-panel .wp-opt {
    width:100%; height:50px; border-radius:8px; margin-bottom:8px; cursor:pointer;
    border:2px solid transparent; transition:.2s;
  }
  .wallpaper-panel .wp-opt:hover { border-color:#a855f7; }
  .wallpaper-panel label {
    display:block; padding:8px; text-align:center; font-size:12px;
    background:rgba(255,255,255,0.08); border-radius:8px; cursor:pointer;
  }
  .wallpaper-panel label:hover { background:rgba(168,85,247,0.3); }
  .wallpaper-panel input[type=file] { display:none; }

  ::-webkit-scrollbar { width:6px; }
  ::-webkit-scrollbar-thumb { background:rgba(168,85,247,0.5); border-radius:4px; }
  ::-webkit-scrollbar-track { background:transparent; }

  @media(max-width:600px){
    .auth-box{padding:25px;}
    .bubble-wrap{max-width:80%;}
    .topbar .brand{font-size:15px;}
    .topbar .room-badge{display:none;}
    .topbar .user-info span#myName{display:none;}
  }
</style>
</head>
<body>

<!-- REGISTER -->
<div class="auth-wrap" id="registerView">
  <div class="auth-box">
    <h1>Daftar Akun</h1>
    <p class="sub">Buat akun buat gabung chat publik</p>
    <div class="err" id="regErr"></div>
    <input type="text" id="regUser" placeholder="Username" autocomplete="off">
    <input type="password" id="regPass" placeholder="Password">
    <input type="password" id="regPass2" placeholder="Konfirmasi Password">
    <button onclick="doRegister()">Register</button>
    <p class="switch-text">Udah punya akun? <a onclick="showLogin()">Login</a></p>
  </div>
</div>

<!-- LOGIN -->
<div class="auth-wrap hidden" id="loginView">
  <div class="auth-box">
    <h1>PublikChat</h1>
    <p class="sub">Login buat mulai ngobrol bareng 🗿</p>
    <div class="err" id="logErr"></div>
    <div class="loading hidden" id="logLoading">Menghubungkan ke server...</div>
    <input type="text" id="logUser" placeholder="Username" autocomplete="off">
    <input type="password" id="logPass" placeholder="Password">
    <button onclick="doLogin()">Login</button>
    <p class="switch-text">Belum punya akun? <a onclick="showRegister()">Register</a></p>
  </div>
</div>

<!-- APP -->
<div class="app hidden" id="appView">
  <div class="topbar">
    <div>
      <span class="brand">💬 PublikChat</span>
      <span class="room-badge">🌍 Public Room</span>
    </div>
    <div class="user-info">
      <div class="avatar" id="myAvatar">?</div>
      <span id="myName">user</span>
      <button onclick="toggleWallpaper()">🖼️</button>
      <button onclick="doLogout()">Logout</button>
    </div>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="input-bar">
    <button class="icon-btn" title="Kirim Foto/Video" onclick="document.getElementById('fileInput').click()">📎</button>
    <input type="file" id="fileInput" accept="image/*,video/*" style="display:none" onchange="sendFile(event)">
    <button class="icon-btn" id="recBtn" title="Voice Note" onclick="toggleRecord()">🎤</button>
    <input type="text" id="msgInput" placeholder="Ketik pesan..." onkeydown="if(event.key==='Enter')sendText()">
    <button class="send-btn" onclick="sendText()">➤</button>
  </div>

  <div class="wallpaper-panel hidden" id="wpPanel">
    <h4>Pilih Wallpaper</h4>
    <div class="wp-opt" style="background:linear-gradient(135deg,#2a1050,#103050)" onclick="setWallpaper('linear-gradient(135deg,#2a1050,#103050)')"></div>
    <div class="wp-opt" style="background:linear-gradient(135deg,#0f2027,#2c5364)" onclick="setWallpaper('linear-gradient(135deg,#0f2027,#2c5364)')"></div>
    <div class="wp-opt" style="background:linear-gradient(135deg,#42275a,#734b6d)" onclick="setWallpaper('linear-gradient(135deg,#42275a,#734b6d)')"></div>
    <div class="wp-opt" style="background:linear-gradient(135deg,#1a2a6c,#b21f1f,#fdbb2d)" onclick="setWallpaper('linear-gradient(135deg,#1a2a6c,#b21f1f,#fdbb2d)')"></div>
    <label>📷 Upload Gambar
      <input type="file" accept="image/*" onchange="uploadWallpaper(event)">
    </label>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, onValue, query, limitToLast }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

/* ================== FIREBASE CONFIG ================== */
const firebaseConfig = {
  apiKey: "AIzaSyBQP4sa-NbpNeiBiJDaovfJF3e1s_Vbw6M",
  authDomain: "publikchat-a1644.firebaseapp.com",
  databaseURL: "https://publikchat-a1644-default-rtdb.firebaseio.com",
  projectId: "publikchat-a1644",
  storageBucket: "publikchat-a1644.firebasestorage.app",
  messagingSenderId: "935035583030",
  appId: "1:935035583030:web:854c89f51705bfc10a3697"
};
/* ==================================================== */

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ================== LOCAL AUTH ================== */
const Auth = {
  get: (k, def) => JSON.parse(localStorage.getItem(k) || JSON.stringify(def)),
  set: (k, v) => localStorage.setItem(k, JSON.stringify(v))
};

/* ================== UI HELPERS ================== */
function showLogin(){
  document.getElementById('registerView').classList.add('hidden');
  document.getElementById('loginView').classList.remove('hidden');
}
function showRegister(){
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('registerView').classList.remove('hidden');
}

/* ================== AUTH LOGIC ================== */
function doRegister(){
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value;
  const p2 = document.getElementById('regPass2').value;
  const err = document.getElementById('regErr');
  err.textContent = '';

  if(!u || !p) return err.textContent = 'Username & password wajib diisi!';
  if(u.length < 3) return err.textContent = 'Username minimal 3 karakter!';
  if(p.length < 4) return err.textContent = 'Password minimal 4 karakter!';
  if(p !== p2) return err.textContent = 'Konfirmasi password ga cocok!';
  if(/[.#$\[\]]/.test(u)) return err.textContent = 'Username ga boleh pakai . # $ [ ]';

  const users = Auth.get('pc_users', {});
  if(users[u]) return err.textContent = 'Username udah dipake!';

  users[u] = p;
  Auth.set('pc_users', users);
  alert('✅ Register berhasil! Silakan login.');
  document.getElementById('regUser').value = '';
  document.getElementById('regPass').value = '';
  document.getElementById('regPass2').value = '';
  showLogin();
}

function doLogin(){
  const u = document.getElementById('logUser').value.trim();
  const p = document.getElementById('logPass').value;
  const err = document.getElementById('logErr');
  const loading = document.getElementById('logLoading');
  err.textContent = '';

  const users = Auth.get('pc_users', {});
  if(!users[u]) return err.textContent = 'Username ga terdaftar!';
  if(users[u] !== p) return err.textContent = 'Password salah!';

  loading.classList.remove('hidden');
  setTimeout(() => {
    loading.classList.add('hidden');
    Auth.set('pc_current', u);
    enterApp(u);
  }, 400);
}

function doLogout(){
  if(unsubscribeChat) unsubscribeChat();
  localStorage.removeItem('pc_current');
  document.getElementById('appView').classList.add('hidden');
  showLogin();
  document.getElementById('logPass').value = '';
}

/* ================== APP INIT ================== */
let currentUser = '';
let unsubscribeChat = null;

function enterApp(u){
  currentUser = u;
  document.getElementById('loginView').classList.add('hidden');
  document.getElementById('registerView').classList.add('hidden');
  document.getElementById('appView').classList.remove('hidden');
  document.getElementById('myName').textContent = u;
  document.getElementById('myAvatar').textContent = u[0].toUpperCase();

  const wp = Auth.get('pc_wallpaper_' + u, '');
  const area = document.getElementById('chatArea');
  if(wp) area.style.backgroundImage = wp.startsWith('linear') ? wp : `url(${wp})`;
  else area.style.background = 'linear-gradient(135deg,#0f2027,#2c5364)';

  listenChat();
}

/* ================== FIREBASE CHAT (PUBLIC ROOM) ================== */
function listenChat(){
  if(unsubscribeChat) unsubscribeChat();

  const area = document.getElementById('chatArea');
  area.innerHTML = '';
  const roomRef = query(ref(db, `publikchat/messages`), limitToLast(200));

  unsubscribeChat = onValue(roomRef, (snapshot) => {
    area.innerHTML = '';
    const data = snapshot.val();
    if(!data) {
      area.innerHTML = `
        <div class="empty-state">
          <span class="big">🌍</span>
          Belum ada pesan di room publik.<br>
          Jadi yang pertama ngobrol!
        </div>`;
      return;
    }
    const msgs = Object.values(data).sort((a,b) => a.ts - b.ts);
    msgs.forEach(m => area.appendChild(buildMsg(m)));
    area.scrollTop = area.scrollHeight;
  }, (error) => {
    console.error(error);
    area.innerHTML = `<div class="empty-state" style="color:#ff5566;">⚠️ Gagal konek database.<br>Cek rules Firebase lu!</div>`;
  });
}

function buildMsg(m){
  const isSelf = m.user === currentUser;
  const div = document.createElement('div');
  div.className = 'msg' + (isSelf ? ' self' : '');

  const av = document.createElement('div');
  av.className = 'av';
  av.textContent = m.user[0].toUpperCase();

  const wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';

  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = isSelf ? 'Lu' : m.user;

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  if(m.type === 'text') bubble.textContent = m.content;
  else if(m.type === 'image'){ const i=document.createElement('img'); i.src=m.content; bubble.appendChild(i); }
  else if(m.type === 'video'){ const v=document.createElement('video'); v.src=m.content; v.controls=true; bubble.appendChild(v); }
  else if(m.type === 'voice'){ const a=document.createElement('audio'); a.src=m.content; a.controls=true; bubble.appendChild(a); }
  else bubble.textContent = m.content;

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = new Date(m.ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});

  wrap.appendChild(name); wrap.appendChild(bubble); wrap.appendChild(time);
  div.appendChild(av); div.appendChild(wrap);
  return div;
}

/* ================== SEND ================== */
function sendText(){
  const inp = document.getElementById('msgInput');
  const v = inp.value.trim();
  if(!v) return;
  push(ref(db, 'publikchat/messages'), {
    user: currentUser, type: 'text', content: v, ts: Date.now()
  });
  inp.value = '';
  inp.focus();
}

function sendFile(e){
  const f = e.target.files[0]; if(!f) return;
  if(f.size > 500 * 1024) return alert('File max 500KB buat hemat database. Kompres dulu ya!');
  const type = f.type.startsWith('video') ? 'video' : 'image';
  const reader = new FileReader();
  reader.onload = ev => {
    push(ref(db, 'publikchat/messages'), {
      user: currentUser, type, content: ev.target.result, ts: Date.now()
    });
  };
  reader.readAsDataURL(f);
  e.target.value = '';
}

/* ================== VOICE NOTE ================== */
let mediaRec = null, chunks = [], recording = false;

async function toggleRecord(){
  const btn = document.getElementById('recBtn');
  if(!recording){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      mediaRec = new MediaRecorder(stream);
      chunks = [];
      mediaRec.ondataavailable = e => chunks.push(e.data);
      mediaRec.onstop = () => {
        const blob = new Blob(chunks, {type:'audio/webm'});
        if(blob.size > 500 * 1024) {
          alert('Voice note kepanjangan (max ~500KB).');
        } else {
          const reader = new FileReader();
          reader.onload = ev => {
            push(ref(db, 'publikchat/messages'), {
              user: currentUser, type: 'voice', content: ev.target.result, ts: Date.now()
            });
          };
          reader.readAsDataURL(blob);
        }
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRec.start();
      recording = true;
      btn.classList.add('rec');
      btn.textContent = '⏹️';
    }catch(err){ alert('Mic ga bisa diakses: '+err.message); }
  } else {
    mediaRec.stop();
    recording = false;
    btn.classList.remove('rec');
    btn.textContent = '🎤';
  }
}

/* ================== WALLPAPER ================== */
function toggleWallpaper(){
  document.getElementById('wpPanel').classList.toggle('hidden');
}
function setWallpaper(css){
  document.getElementById('chatArea').style.backgroundImage = css;
  Auth.set('pc_wallpaper_' + currentUser, css);
  toggleWallpaper();
}
function uploadWallpaper(e){
  const f = e.target.files[0]; if(!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    document.getElementById('chatArea').style.backgroundImage = `url(${ev.target.result})`;
    Auth.set('pc_wallpaper_' + currentUser, ev.target.result);
    toggleWallpaper();
  };
  reader.readAsDataURL(f);
}

/* ================== KEYBOARD FIX ================== */
const msgInput = document.getElementById('msgInput');
if(msgInput){
  msgInput.addEventListener('focus', () => {
    setTimeout(() => {
      const area = document.querySelector('.chat-area');
      if(area) area.scrollTop = area.scrollHeight;
    }, 300);
  });
}
window.addEventListener('resize', () => {
  const area = document.querySelector('.chat-area');
  if(area) area.scrollTop = area.scrollHeight;
});

/* ================== EXPOSE ================== */
window.showLogin = showLogin;
window.showRegister = showRegister;
window.doRegister = doRegister;
window.doLogin = doLogin;
window.doLogout = doLogout;
window.sendText = sendText;
window.sendFile = sendFile;
window.toggleRecord = toggleRecord;
window.toggleWallpaper = toggleWallpaper;
window.setWallpaper = setWallpaper;
window.uploadWallpaper = uploadWallpaper;

/* ================== AUTO LOGIN ================== */
(function(){
  const u = Auth.get('pc_current', null);
  if(u) enterApp(u);
})();
</script>
</body>
</html>
